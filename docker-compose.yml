volumes:
  HNG-nginx-logs: # Named volume — must be exactly this name
  nextcloud_data:
  db_data:

services:
  db:
    image: mariadb:10.11
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - db_data:/var/lib/mysql

  nextcloud:
    image: kefaslungu/hng-nextcloud # Must use this exact image
    platform: linux/amd64
    entrypoint: ["/bin/sh", "/entrypoint.sh", "apache2-foreground"]
    restart: always
    depends_on:
      - db
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: "${DB_PASSWORD}"
      NEXTCLOUD_TRUSTED_DOMAINS: "${TRUSTED_DOMAINS}"
      NEXTCLOUD_ADMIN_USER: "${ADMIN_USER}"
      NEXTCLOUD_ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
    volumes:
      - nextcloud_data:/var/www/html
      - HNG-nginx-logs:/var/log/nginx:ro # Read-only mount

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    depends_on:
      - nextcloud
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - HNG-nginx-logs:/var/log/nginx # Nginx writes here

  detector:
    build: ./detector
    restart: always
    network_mode: host # Needs host networking for iptables
    cap_add:
      - NET_ADMIN # Required for iptables
    volumes:
      - HNG-nginx-logs:/var/log/nginx:ro # Read-only
    environment:
      SLACK_WEBHOOK_URL: "${SLACK_WEBHOOK}"
      DRY_RUN: "${DRY_RUN}"
      PYTHONUNBUFFERED: "1"
    ports:
      - "8080:8080" # Dashboard port
