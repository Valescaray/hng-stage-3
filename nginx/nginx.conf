user nginx;
worker_processes auto;

events { worker_connections 1024; }

http {
    # Use X-Forwarded-For if present, otherwise fall back to the direct client IP.
    # This ensures local curl tests and direct connections are also captured.
    map $http_x_forwarded_for $real_client_ip {
        ""      $remote_addr;
        default $http_x_forwarded_for;
    }

    log_format json_combined escape=json
        '{'
        '"source_ip":"$real_client_ip",'
        '"timestamp":"$time_iso8601",'
        '"method":"$request_method",'
        '"path":"$request_uri",'
        '"status":$status,'
        '"response_size":$body_bytes_sent,'
        '"user_agent":"$http_user_agent",'
        '"request_time":$request_time'
        '}';

    access_log /var/log/nginx/hng-access.log json_combined;

    # Trust X-Forwarded-For from upstream proxies
    set_real_ip_from  0.0.0.0/0;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    upstream nextcloud {
        server nextcloud:80;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://nextcloud;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            client_max_body_size 512M;
            proxy_read_timeout 300;
        }
    }
}
